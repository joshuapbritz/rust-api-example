[package]
name = "lb-interview-test"
version = "0.1.0"
edition = "2024"

[dependencies]
    tokio = { version = "1", features = ["full"] }
    warp = { version = "0.4", features = ["server", "multipart"] }
    reqwest = { version = "0.12", features = ["json"] }
    serde = { version = "1.0", features = ["derive"] }
    serde_json = "1.0"
    dotenvy = "0.15"
    uuid = { version = "1.0", features = ["v4", "serde"] }
    chrono = { version = "0.4", features = ["serde"] }
    diesel = { version = "2.2.0", features = ["postgres", "uuid", "chrono", "r2d2", "chrono"] }
    diesel_migrations = "2.2.0"
    lazy_static = "1.3.0"
    anyhow = "1.0.27"
    thiserror = "1.0.14"
    r2d2 = "0.8.5"
    base64 = "0.12.0"
    jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
    email_address = "0.2"
    bytes = "1.11.0"
    futures-util = "0.3.31"
    argon2 = "0.5.3"
    env_logger = "0.11"
    log = "0.4"
ollama-rs = "0.3.3"
schemars = "1.1.0"
governor = "0.10.2"
